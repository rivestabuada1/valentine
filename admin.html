<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('./images/background.webp');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Arial', sans-serif;
            padding: 20px;
        }

        .login-container {
            background: rgb(255, 187, 209);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
            text-align: center;
            display: block;
        }

        .admin-container {
            background: rgb(255, 187, 209);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            display: none;
        }

        .admin-container.show {
            display: block;
        }

        h1 {
            font-size: 28px;
            color: #ff1744;
            margin-bottom: 30px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="password"] {
            padding: 12px 20px;
            font-size: 16px;
            border: 2px solid #ff1744;
            border-radius: 10px;
            text-align: center;
        }

        input[type="password"]:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(255, 23, 68, 0.5);
        }

        button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #ff1744 0%, #ff5983 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 23, 68, 0.3);
        }

        .admin-info {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: left;
        }

        .admin-info h3 {
            color: #ff1744;
            margin-bottom: 10px;
        }

        .admin-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border-left: 4px solid #ff1744;
        }

        .stat-box .number {
            font-size: 32px;
            font-weight: bold;
            color: #ff1744;
        }

        .stat-box .label {
            font-size: 14px;
            color: #666;
        }

        .action-section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .action-section h3 {
            color: #ff1744;
            margin-bottom: 15px;
        }

        .delete-btn {
            background: linear-gradient(135deg, #d32f2f 0%, #f44336 100%);
            width: 100%;
        }

        .delete-btn:hover {
            box-shadow: 0 5px 15px rgba(211, 47, 47, 0.3);
        }

        .logout-btn {
            background: #666;
            width: 100%;
            margin-top: 20px;
        }

        .logout-btn:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #ff1744;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- Login Container -->
    <div class="login-container" id="loginContainer">
        <h1>🔐 Admin Login</h1>
        <div class="login-form">
            <input type="password" id="passwordInput" placeholder="Enter admin password" />
            <button onclick="login()">Login</button>
        </div>
        <a href="responses.html" class="back-link">← Back to Responses</a>
    </div>

    <!-- Admin Container -->
    <div class="admin-container" id="adminContainer">
        <h1>⚙️ Admin Panel</h1>

        <div class="admin-stats">
            <div class="stat-box">
                <div class="number" id="totalResponses">0</div>
                <div class="label">Total Responses</div>
            </div>
            <div class="stat-box">
                <div class="number" id="yesCount">0</div>
                <div class="label">Yes Answers</div>
            </div>
        </div>

        <div class="action-section">
            <h3>⚡ Danger Zone</h3>
            <p style="margin-bottom: 15px; color: #666; font-size: 14px;">Delete all responses from the system. This action cannot be undone!</p>
            <button class="delete-btn" onclick="deleteAllResponses()">🗑️ Delete ALL Responses</button>
        </div>

        <button class="logout-btn" onclick="logout()">Logout</button>

        <a href="responses.html" class="back-link">← Back to Responses</a>
    </div>

    <script>
        const loginContainer = document.getElementById('loginContainer');
        const adminContainer = document.getElementById('adminContainer');
        const passwordInput = document.getElementById('passwordInput');
        const ADMIN_PASSWORD = 'admin123';

        function login() {
            const password = passwordInput.value;
            if (password === ADMIN_PASSWORD) {
                loginContainer.style.display = 'none';
                adminContainer.classList.add('show');
                loadStats();
            } else {
                alert('Incorrect password!');
                passwordInput.value = '';
            }
        }

        function logout() {
            loginContainer.style.display = 'block';
            adminContainer.classList.remove('show');
            passwordInput.value = '';
        }

        function loadStats() {
            const responses = JSON.parse(localStorage.getItem('valentineResponses')) || [];
            const totalResponses = responses.length;
            const yesCount = responses.filter(r => r.answer === 'yes').length;

            document.getElementById('totalResponses').textContent = totalResponses;
            document.getElementById('yesCount').textContent = yesCount;
        }

        function deleteAllResponses() {
            if (confirm('⚠️ Are you sure you want to DELETE ALL responses? This cannot be undone!')) {
                const confirmPassword = prompt('Enter admin password to confirm deletion:');
                if (confirmPassword === ADMIN_PASSWORD) {
                    // Clear localStorage completely
                    localStorage.clear();
                    alert('✅ All responses have been successfully deleted!');
                    // Reload and redirect
                    window.location.href = 'responses.html?cleared=' + new Date().getTime();
                } else if (confirmPassword !== null) {
                    alert('❌ Incorrect password!');
                }
            }
        }

        // Allow Enter key to login
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                login();
            }
        });

        // Focus on password input on load
        passwordInput.focus();
    </script>
</body>
</html>
